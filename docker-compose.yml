services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: coachly-db
    environment:
      POSTGRES_DB: coachly
      POSTGRES_USER: coachly
      POSTGRES_PASSWORD: coachly123
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coachly"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Spring Boot Application
  app:
    build: .
    container_name: coachly-app
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/coachly
      SPRING_DATASOURCE_USERNAME: coachly
      SPRING_DATASOURCE_PASSWORD: coachly123

volumes:
  postgres_data:
